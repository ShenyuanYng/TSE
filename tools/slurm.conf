# Default configuration
#
command sbatch --ntasks=1 #--nodelist=babel-9-[3,7,11,15,19],babel-2-12 # L40, long
#command sbatch --ntasks=1 --nodelist=v100gpu010v16g
#
#option mem=* --mem-per-cpu $0
option mem=* --mem $0
option mem=0          # Do not add anything to qsub_opts
option num_threads=* --cpus-per-task $0 --ntasks-per-node=1
default gpu=0
#---------------------------------------------------------------------------------
#
#option gpu=* -p gpulab01 --gres=gpu:$0 --time 2-00:00:00 --qos gpulab01 # 2080TI
option gpu=* -p L40 --gres=gpu:$0 --time 2-00:00:00 # L40
#option gpu=* -p RTX5880Ada --gres=gpu:$0 --time 2-00:00:00 # RTX5880Ada
#
option dependency=* --dependency=afterany:$0
option dependency=0   # Do not add anything to qsub_opts
# note: the --max-jobs-run option is supported as a special case
# by slurm.pl and you don't have to handle it in the config file
