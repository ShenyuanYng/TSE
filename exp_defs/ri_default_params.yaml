batch_size: 8
seed: 7
shuffle: true # shuffle training examples at every epoch
num_workers: 1

learning_rate: 0.001
decay_factor: 0.5
patience: 5
gradient_clip_val: 1.0
epochs: 100

gpus: 0
distributed_backend: ddp
save_path: "./experiments" # top level path to save output
save_name: "pl_logs" # experiment name

train_percent_check: 1.0
val_percent_check: 1.0
test_percent_check: 1.0

data_orig_path: '/scratch/wangzhon/MERL-dereverb_signals/fixarr/'
data_path: '/scratch/wangzhon/MERL-dereverb_signals/fixarr/'
dataset: fixarr_h1+n-s1
max_num_mics: 7 # maximum number of input microphones
max_num_omics: 7 # maximum number of output microphones
samplerate: 16000
feature_type: 'ri'
fft_size: 0
inwintime: 0.032
hoptime: 0.008
window_type: 'sqrt_hann'
train_on_chunk: 5.024 # segment length for training, for each mixture, we randomly select a segment for training in each epoch
rms_norm: 1

loss_type: ri_inference
mask_loss_type: 'l1'
loss_items: 'rix2+mag'
permutation_invariant: false

model_name: DPRNNTF # type of model: chimera, mask_inference, ...
num_sources: 2 # number of separated sources output by network
num_imics: 1 # number of input microphones for networking training
num_omics: 1 # number of output microphones for networking training
seqmodel_type: 2 # model type
num_layers: 4 # number of layers
masking_or_mapping: 1 # use complex masking or mapping, 0: masking; 1: mapping
mask_nonlinearity: linear # activaiton for producing estimated real and imag components
target_trunc_max: 10 # maximum value to truncate estimated complex masks
act_type: elu
norm_type: GlobalInstanceNormalization
convnormact_type: 2 # Order of convolution, normalization, activation, choices=[0, 1, 2]. 0: norm-act-conv; 1: conv-norm-act; 2: conv-act-norm

# DPRNN
num_hid_units: 128
emb_dim: 16
emb_ks: 8
emb_hs: 4

cudnn_deterministic: 0
cudnn_benchmark: 1

hostname: "cse-cnc227601s" # record the hostname that runs the code
gpuidx: "0" # record the gpu id that runs the code, not useful for slurm

first_conv_use_act: 0
ref_mic: -1
pad_back_or_front: 0 # when padding training segments, we can pad to the front or back, 0: pad back; 1: pad front

mag_sf: 1.0 # power compression factor to magnitude
